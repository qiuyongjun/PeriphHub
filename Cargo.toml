[package]
name = "periphhub"
version = "0.2.0"
edition = "2021"
description = "Windows 桌面外设配置面板：直接通过 USB HID 厂商协议读写鼠标/键盘参数"
authors = ["qiuyongjun"]
license = "MIT"
repository = "https://github.com/qiuyongjun/PeriphHub"
readme = "README.md"

[[bin]]
name = "PeriphHub"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", features = ["glow"] }
# Same version eframe pulls in: needed to reach winit's Windows-only window
# attributes (the frameless-window shadow that paints a 1px line on top).
winit = "0.30"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.26"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Graphics_Dwm",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
