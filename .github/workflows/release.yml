name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo.toml
        shell: pwsh
        run: |
          $match = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"'
          if (-not $match) { throw '无法从 Cargo.toml 读取版本号' }
          $version = $match.Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
              throw "tag ${{ github.ref_name }} 与 Cargo.toml 版本 $version 不一致"
          }

      - name: Test
        run: cargo test --locked

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = "PeriphHub-${{ github.ref_name }}-win-x64"
          $zip = (Resolve-Path "dist/$name.zip").Path
          $sum = (Resolve-Path 'dist/SHA256SUMS.txt').Path
          $setup = "dist/$name-setup.exe"
          # 安装包要和校验和一起发：package.ps1 只在检测到 Inno Setup 6.5+
          # 时才编译它，并同时把哈希写进 SHA256SUMS。按本次 tag 精确匹配，
          # 避免把 dist 里残留的旧版本产物传上去。
          $files = @($zip, $sum)
          if (Test-Path $setup) { $files += (Resolve-Path $setup).Path }
          if (-not (Test-Path $setup) -and
              (Select-String -Path $sum -Pattern '-setup\.exe' -Quiet)) {
              throw 'SHA256SUMS.txt 列了安装包，但 dist 里没有对应文件'
          }
          $ghArgs = @('release', 'create', "${{ github.ref_name }}") + $files + @(
              '--title', "PeriphHub ${{ github.ref_name }}",
              '--generate-notes'
          )
          gh @ghArgs
          if ($LASTEXITCODE -ne 0) { throw 'gh release create 失败' }
