name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo.toml
        shell: pwsh
        run: |
          $match = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"'
          if (-not $match) { throw '无法从 Cargo.toml 读取版本号' }
          $version = $match.Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
              throw "tag ${{ github.ref_name }} 与 Cargo.toml 版本 $version 不一致"
          }

      - name: Test
        run: cargo test --locked

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = (Get-ChildItem dist -Filter *.zip).FullName
          $sum = (Resolve-Path 'dist/SHA256SUMS.txt').Path
          gh release create "${{ github.ref_name }}" $zip $sum --title "PeriphHub ${{ github.ref_name }}" --generate-notes
